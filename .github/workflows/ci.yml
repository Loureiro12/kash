name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem de packageManager no package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem de packageManager no package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # mesma versão local: o check de drift dos tipos depende do gerador
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Edge Functions (deno test)
        run: deno test
        working-directory: supabase/functions
      - run: supabase start
      - name: pgTAP
        run: supabase test db
      - name: Contrato de tipos (gen types sem diff)
        # regenera com o mesmo script usado localmente (mesma CLI, mesmo prettier) e exige arquivo idêntico ao commitado
        run: |
          pnpm db:types
          git diff --exit-code -- packages/supabase-client/src/database.types.ts
      - name: Integração (Vitest contra o Supabase local)
        run: pnpm --filter @kash/supabase-client test
      - if: always()
        run: supabase stop --no-backup

  # Site (apps/web): build de produção + Playwright no celular e no desktop, com axe.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem de packageManager no package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # E2E (Maestro) exige simulador iOS — roda em macOS e só manualmente/por tag para não travar PRs.
  e2e-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem de packageManager no package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - run: pnpm --filter mobile exec expo run:ios --device "iPhone 16 Pro" --no-bundler
      - run: (pnpm --filter mobile exec expo start --dev-client &) && sleep 20
      - run: PATH="$HOME/.maestro/bin:$PATH" pnpm e2e:ios
