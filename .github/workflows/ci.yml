name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Edge Functions (deno test)
        run: deno test
        working-directory: supabase/functions
      - run: supabase start
      - name: pgTAP
        run: supabase test db
      - name: Contrato de tipos (gen types sem diff)
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          npx prettier --write /tmp/database.types.ts packages/supabase-client/src/database.types.ts >/dev/null
          diff -q /tmp/database.types.ts packages/supabase-client/src/database.types.ts
      - name: Integração (Vitest contra o Supabase local)
        run: pnpm --filter @kash/supabase-client test
      - if: always()
        run: supabase stop --no-backup

  # E2E (Maestro) exige simulador iOS — roda em macOS e só manualmente/por tag para não travar PRs.
  e2e-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - run: pnpm --filter mobile exec expo run:ios --device "iPhone 16 Pro" --no-bundler
      - run: (pnpm --filter mobile exec expo start --dev-client &) && sleep 20
      - run: PATH="$HOME/.maestro/bin:$PATH" pnpm e2e:ios
