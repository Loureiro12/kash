name: Deploy backend (produção)

# Aplica migrações, Edge Functions e config de auth no projeto Supabase de produção.
# Exige o environment `production` com SUPABASE_PROJECT_REF (variável) e os secrets SUPABASE_ACCESS_TOKEN
# e SUPABASE_DB_PASSWORD (ver docs/release.md). A CI de testes continua em ci.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/templates/**'
      - 'supabase/config.toml'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # Sem condição no job: o `if` de job é avaliado antes de o job entrar no environment, então
    # variáveis do environment `production` chegam vazias ali e o job era sempre pulado.
    # A checagem fica no primeiro passo, que falha com uma mensagem clara se faltar configuração.
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Configuração do environment
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam SUPABASE_PROJECT_REF (variável) ou SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD (secrets) no environment production. Ver docs/release.md."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # mesma versão local: o check de drift dos tipos depende do gerador
      - name: Link
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrações
        run: supabase db push --linked
      - name: Edge Functions
        # sem nome: publica todas as funções de supabase/functions (verify_jwt vem do config.toml)
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: Config de auth (templates, redirects)
        # KASH_SMTP=1 (variável do environment) envia também os templates de e-mail; exige SMTP próprio
        run: KASH_SMTP="${{ vars.KASH_SMTP || 0 }}" scripts/config-push.sh
