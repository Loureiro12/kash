appId: ${APP_ID}
name: Biometria 4 — rosto não reconhecido; cancelar e "Entrar com senha" volta ao login
---
- tapOn:
    text: "Cancelar|Cancel"
    optional: true
- assertVisible:
    id: "app-lock"
- tapOn:
    id: "app-lock-password"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 10000
