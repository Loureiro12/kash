appId: ${APP_ID}
name: Cartões — selecionar e adicionar
---
- runFlow: ../subflows/login.yaml
- tapOn:
    id: "tab-cards"
- assertVisible:
    id: "cards-screen"
- assertVisible: "Toque num cartão pra ver a fatura."
- assertVisible: "Limite usado"

# Cartão principal selecionado por padrão
- assertVisible: "Celular novo"

# Seleciona o segundo cartão
- swipe:
    direction: LEFT
    from:
      id: "card-c0000000-0000-4000-8000-000000000001"
- tapOn:
    id: "card-c0000000-0000-4000-8000-000000000002"
- assertVisible: "Tênis de corrida"

# Novo cartão
- swipe:
    direction: LEFT
    from:
      id: "card-c0000000-0000-4000-8000-000000000002"
- tapOn:
    id: "card-add"
- assertVisible:
    id: "sheet-add-card"
- assertVisible: "Nome do cartão"
- tapOn:
    id: "add-card-color-blue"
- tapOn:
    id: "add-card-name"
- inputText: "Cartão da facul"
# "seguinte" leva ao campo dos 4 dígitos; ao completar 4 dígitos o foco vai pro limite
- pressKey: Enter
- inputText: "9999"
# máscara: dígitos entram pelos centavos
- inputText: "150000"
- assertVisible: "R$ 1.500,00"
# CTA fixo no rodapé fica visível mesmo com o teclado aberto
- tapOn:
    id: "add-card-save"
- assertVisible: "Cartão “Cartão da facul” adicionado"
# novo cartão fica selecionado e sem gastos
- assertVisible: "Nenhum gasto nesse cartão ainda."
