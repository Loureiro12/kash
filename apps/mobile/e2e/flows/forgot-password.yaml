appId: ${APP_ID}
name: Esqueci a senha — validação, envio e volta
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn:
    id: "onboarding-cta"
- tapOn:
    id: "login-forgot"
- assertVisible:
    id: "forgot-screen"
- tapOn:
    id: "forgot-submit"
- assertVisible: "Esse e-mail não parece válido."
- tapOn:
    id: "forgot-email"
- inputText: "lara@email.com"
- tapOn:
    id: "forgot-submit"
- extendedWaitUntil:
    visible:
      id: "forgot-sent"
    timeout: 5000
- assertVisible: "E-mail enviado"
- tapOn:
    id: "forgot-done"
- assertVisible:
    id: "login-screen"
