appId: ${APP_ID}
name: Metas — guardar R$ 50
---
- runFlow: ../subflows/login.yaml
- tapOn:
    id: "tab-goals"
- assertVisible:
    id: "goals-screen"
- assertVisible: '.*R\$ 3\.960,00.*'
- assertVisible: "Viagem pra praia"
- assertVisible: "Faltam 6 meses nesse ritmo"
- tapOn:
    id: "goal-9f000000-0000-4000-8000-000000000001-add"
- assertVisible: "R$ 50,00 guardados em “Viagem pra praia”"
- assertVisible: "R$ 1.290,00 de R$ 3.000,00"
- assertVisible: '.*R\$ 4\.010,00.*'

# Nova meta
- scrollUntilVisible:
    element:
      id: "goals-add"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "goals-add"
- assertVisible:
    id: "sheet-add-goal"
# conta e cor antes de digitar: com o teclado aberto esses controles ficam abaixo da dobra
- tapOn:
    id: "add-goal-account-a0000000-0000-4000-8000-000000000002"
- tapOn:
    id: "add-goal-color-2"
- tapOn:
    id: "add-goal-name"
- inputText: "Notebook"
- pressKey: Enter
- inputText: "400000"
- assertVisible: "R$ 4.000,00"
- tapOn:
    id: "add-goal-saved"
- inputText: "100000"
- tapOn:
    id: "add-goal-monthly"
- inputText: "50000"
- assertVisible: "Faltam 6 meses nesse ritmo"
- tapOn:
    id: "add-goal-day"
- inputText: "15"
- tapOn:
    id: "add-goal-save"
- assertVisible: "Meta “Notebook” criada"
- assertVisible: "Notebook"
- assertVisible: "R$ 1.000,00 de R$ 4.000,00"
# total guardado: 4.010 + 1.000
- assertVisible: '.*R\$ 5\.010,00.*'

# Depósito pendente (Reserva de emergência tem dia 1): registrar depósito
- scrollUntilVisible:
    element:
      id: "goal-9f000000-0000-4000-8000-000000000003-deposit"
    direction: UP
    centerElement: true
- assertVisible: "Depositar"
- tapOn:
    id: "goal-9f000000-0000-4000-8000-000000000003-deposit"
- assertVisible:
    id: "sheet-deposit"
- assertVisible: "R$ 250,00"
- tapOn:
    id: "deposit-account-a0000000-0000-4000-8000-000000000001"
- tapOn:
    id: "deposit-save"
- assertVisible: "R$ 250,00 depositado em “Reserva de emergência”"
- assertVisible: "R$ 2.350,00 de R$ 5.000,00"
- assertNotVisible:
    id: "goal-9f000000-0000-4000-8000-000000000003-deposit"
- assertVisible:
    id: "goal-9f000000-0000-4000-8000-000000000003-add"
- scrollUntilVisible:
    element:
      text: "Dica da semana"
    direction: DOWN
