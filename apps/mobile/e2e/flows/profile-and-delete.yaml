appId: ${APP_ID}
name: Perfil — tema, sair e excluir conta
tags: [critical]
---
- runFlow: ../subflows/login.yaml
- tapOn:
    id: "home-avatar"
- assertVisible:
    id: "profile-screen"
- assertVisible: "Lara Mendes"
- assertVisible: "lara@email.com"

# Tema claro ↔ escuro
- tapOn:
    id: "profile-theme-switch"
- tapOn:
    id: "profile-theme-switch"

# Sair → Login → entrar de novo
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
- tapOn:
    id: "profile-logout"
- assertVisible:
    id: "login-screen"
- waitForAnimationToEnd
# cadastro: validação e criação (entra com o novo nome)
- tapOn:
    id: "login-signup"
- assertVisible:
    id: "signup-screen"
- tapOn:
    id: "signup-submit"
- assertVisible: "Como a gente te chama?"
- assertVisible: "Precisa aceitar os termos pra continuar."
# aceita os termos antes de digitar (com o teclado aberto o checkbox e o botão ficam sob ele)
- tapOn:
    id: "signup-terms"
- tapOn:
    id: "signup-name"
- inputText: "Ana"
- pressKey: Enter
- inputText: "ana@email.com"
- pressKey: Enter
- inputText: "Senha123"
- assertVisible: "Senha forte"
# "concluído" no teclado envia o formulário
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
- waitForAnimationToEnd

# Excluir conta: precisa confirmar o checkbox
- tapOn:
    id: "home-avatar"
- scrollUntilVisible:
    element:
      id: "profile-delete"
    direction: DOWN
- tapOn:
    id: "profile-delete"
- assertVisible:
    id: "sheet-delete-account"
- assertVisible: "Excluir sua conta?"
- tapOn:
    id: "delete-cancel"
- assertNotVisible:
    id: "sheet-delete-account"
- tapOn:
    id: "profile-delete"
- tapOn:
    id: "delete-confirm"
- assertVisible:
    id: "sheet-delete-account"
- tapOn:
    id: "delete-confirm-checkbox"
- tapOn:
    id: "delete-confirm"
- assertVisible:
    id: "onboarding-screen"
- assertVisible: "Conta excluída"
