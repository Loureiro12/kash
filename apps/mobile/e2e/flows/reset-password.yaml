appId: ${APP_ID}
name: Recuperar senha — código do e-mail, nova senha entra e vale no login
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn:
    id: "onboarding-cta"
- tapOn:
    id: "login-forgot"
- tapOn:
    id: "forgot-email"
- inputText: "lara@email.com"
- tapOn:
    id: "forgot-submit"
- extendedWaitUntil:
    visible:
      id: "forgot-sent"
    timeout: 5000

# código errado mostra erro
- tapOn:
    id: "forgot-code"
- inputText: "000000"
- tapOn:
    id: "forgot-verify"
- extendedWaitUntil:
    visible:
      id: "forgot-error"
    timeout: 10000

# pega o código no Mailpit e digita
- runScript: ../scripts/recovery-code.js
- tapOn:
    id: "forgot-code"
- eraseText: 8
- inputText: ${output.recoveryCode}
- tapOn:
    id: "forgot-verify"
- extendedWaitUntil:
    visible:
      id: "reset-screen"
    timeout: 10000

# validação local
- tapOn:
    id: "reset-password"
- inputText: "novasenha1"
- pressKey: Enter
- inputText: "outra"
- tapOn:
    id: "reset-submit"
- assertVisible: "As senhas não conferem."
- tapOn:
    id: "reset-confirm"
- eraseText: 10
- inputText: "novasenha1"
- tapOn:
    id: "reset-submit"
- extendedWaitUntil:
    visible:
      id: "tab-add"
    timeout: 15000
- assertVisible: "Senha alterada. Bem-vinda de volta!"

# a nova senha vale no login
- tapOn:
    id: "home-avatar"
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-logout"
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "login-email"
- inputText: "lara@email.com"
- pressKey: Enter
- inputText: "novasenha1"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "tab-add"
    timeout: 15000
