appId: ${APP_ID}
name: Recuperar senha — link do e-mail abre o app, nova senha entra e vale no login
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn:
    id: "onboarding-cta"
- tapOn:
    id: "login-forgot"
- tapOn:
    id: "forgot-email"
- inputText: "lara@email.com"
- tapOn:
    id: "forgot-submit"
- extendedWaitUntil:
    visible:
      id: "forgot-sent"
    timeout: 5000

# pega o deep link no Mailpit e abre no simulador
- runScript: ../scripts/recovery-link.js
- openLink: ${output.recoveryLink}
# iOS confirma a abertura de esquema externo
- tapOn:
    text: "Abrir|Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "reset-screen"
    timeout: 10000

# validação local
- tapOn:
    id: "reset-password"
- inputText: "novasenha1"
- pressKey: Enter
- inputText: "outra"
- tapOn:
    id: "reset-submit"
- assertVisible: "As senhas não conferem."
- tapOn:
    id: "reset-confirm"
- eraseText: 10
- inputText: "novasenha1"
- tapOn:
    id: "reset-submit"
- extendedWaitUntil:
    visible:
      id: "tab-add"
    timeout: 15000
- assertVisible: "Senha alterada. Bem-vinda de volta!"

# a nova senha vale no login
- tapOn:
    id: "home-avatar"
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-logout"
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "login-email"
- inputText: "lara@email.com"
- pressKey: Enter
- inputText: "novasenha1"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "tab-add"
    timeout: 15000
