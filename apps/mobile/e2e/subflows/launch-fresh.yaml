# Abre o app do zero (estado limpo) — o store não é persistido nesta fase.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
# alerta do sistema que possa ter sobrado de uma execução anterior (permissão ou "Abrir com Kash?")
- tapOn:
    text: "Permitir|Allow|Cancelar|Cancel"
    optional: true
# Android: limpar o estado apaga a URL do dev client; reabre apontando pro Metro (adb reverse tcp:8081)
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: kash://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- extendedWaitUntil:
    visible:
      id: "onboarding-screen"
    timeout: 60000
