appId: ${APP_ID}
name: Contas — bancárias, fixas e nova conta
---
- runFlow: ../subflows/login.yaml
- tapOn:
    id: "tab-accounts"
- assertVisible:
    id: "accounts-screen"
- assertVisible: "Em todas as contas"
- assertVisible: "R$ 4.225,50"

# Nova conta
- tapOn:
    id: "accounts-add"
- assertVisible:
    id: "sheet-add-account"
- assertVisible:
    id: "add-account-save"
- tapOn:
    id: "add-account-kind-Poupança"
- tapOn:
    id: "add-account-color-1"
- tapOn:
    id: "add-account-name"
- inputText: "Conta do estágio"
- pressKey: Enter
- inputText: "Banco X"
- pressKey: Enter
- inputText: "300"
- tapOn:
    id: "add-account-save"
- assertVisible: "Conta “Conta do estágio” adicionada"
- assertVisible: 'Conta do estágio, Poupança · Banco X.*'
- assertVisible: "R$ 4.525,50"

# Contas fixas: marcar como paga
- tapOn:
    id: "seg-bills"
- assertVisible:
    id: "accounts-bills"
- assertVisible: "R$ 274,60"
- assertVisible: "1/5"
- tapOn:
    id: "bill-bill2"
- assertVisible: "2/5"
- assertVisible: "R$ 174,70"
- tapOn:
    id: "bill-bill2"
- assertVisible: "1/5"

# Nova conta fixa cobrada no cartão
- tapOn:
    id: "bills-add"
- assertVisible:
    id: "sheet-add-bill"
- tapOn:
    id: "add-bill-src-card1"
# categoria padrão já é Assinaturas (o chip fica fora da área visível na linha rolável)
- tapOn:
    id: "add-bill-name"
- inputText: "Spotify"
- pressKey: Enter
- inputText: "21,90"
- tapOn:
    id: "add-bill-day"
- inputText: "8"
- tapOn:
    id: "add-bill-save"
- assertVisible: "Conta fixa “Spotify” adicionada"
- assertVisible: "1/6"

# Conta paga some das próximas contas na Início
- tapOn:
    id: "bill-bill3"
- tapOn:
    id: "tab-home"
- assertNotVisible:
    id: "home-bill-bill3"
- assertVisible:
    id: "home-bill-bill2"

# Internet (cobrada no Cartão principal) paga → entra na fatura: limite usado 16% → 20%
- tapOn:
    id: "tab-accounts"
- tapOn:
    id: "bill-bill2"
- tapOn:
    id: "tab-cards"
- assertVisible: "20%"
- scrollUntilVisible:
    element:
      text: "Cobranças recorrentes"
    direction: DOWN
- assertVisible: "Já na fatura deste mês"
- assertVisible: "Spotify"
