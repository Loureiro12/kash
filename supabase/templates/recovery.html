<h2>Crie uma nova senha</h2>
<p>Recebemos um pedido pra redefinir a senha da sua conta no Kash. Toque no botão abaixo no celular com o app instalado:</p>
<p><a href="kash://reset-password?token_hash={{ .TokenHash }}&type=recovery">Criar nova senha</a></p>
<p>O link vale por 30 minutos e só funciona uma vez. Se não foi você, pode ignorar este e-mail.</p>
